<div class="container-x pt-5 pb-2"><nav class="text-xs font-mono text-graphite flex items-center gap-2"><a href="/index.html" class="hover:text-ink">Inicio</a><span class="opacity-50">/</span><a href="/pages/cuenta/area-personal.html" class="hover:text-ink">Mi área</a><span class="opacity-50">/</span><span class="text-ink">Albaranes</span></nav></div>

<section class="container-x py-6 pb-20"><div class="grid lg:grid-cols-[280px_1fr] gap-8 lg:gap-10">
<aside id="glx-sidebar" class="lg:sticky lg:top-6 lg:self-start" data-active="albaranes"></aside>

<main>
  <div class="flex items-end justify-between flex-wrap gap-4 mb-8">
    <div><div class="eyebrow text-copper mb-2">Documentos comerciales</div><h1 class="font-serif font-medium leading-[0.96]" style="font-size: clamp(2rem, 4.5vw, 3rem);">Albaranes.</h1><p class="text-graphite mt-2" data-alb-summary>Cargando…</p></div>
    <div class="flex gap-2"><button class="btn btn-sm btn-ghost" data-alb-export>Exportar CSV</button></div>
  </div>

  <!-- Filtros -->
  <div class="grid sm:grid-cols-[1fr_auto_auto] gap-3 mb-6">
    <div class="relative"><input type="search" placeholder="Buscar por nº, obra, fabricante o SKU…" class="w-full pl-10 pr-3 py-2.5 bg-white border border-line rounded-lg text-sm outline-none focus:border-ink" data-alb-search/><svg class="absolute left-3 top-1/2 -translate-y-1/2 text-graphite" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
    <select class="bg-white border border-line rounded-lg text-sm py-2.5 px-3 outline-none focus:border-ink" data-alb-period><option value="">Todos los periodos</option></select>
    <select class="bg-white border border-line rounded-lg text-sm py-2.5 px-3 outline-none focus:border-ink" data-alb-worksite><option value="">Todas las obras</option></select>
  </div>

  <!-- Resumen -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    <div class="bg-white border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Albaranes mes</div><div class="font-serif text-2xl font-medium" data-alb-stat-month>—</div></div>
    <div class="bg-white border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Importe mes</div><div class="font-serif text-2xl font-medium" data-alb-stat-month-sum>—</div></div>
    <div class="bg-white border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Productos mes</div><div class="font-serif text-2xl font-medium" data-alb-stat-month-units>—</div></div>
    <div class="bg-white border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Total histórico</div><div class="font-serif text-2xl font-medium" data-alb-stat-total>—</div></div>
  </div>

  <!-- Tabla -->
  <div class="bg-white border border-line rounded-2xl overflow-hidden">
    <div class="px-5 py-3 bg-paper-2 border-b border-line text-xs font-mono uppercase tracking-wider text-graphite grid grid-cols-[80px_140px_1fr_90px_110px] gap-3"><span>Fecha</span><span>Albarán</span><span>Concepto · obra</span><span>Items</span><span>Total</span></div>
    <div class="divide-y divide-line" data-alb-list></div>
    <div class="hidden p-10 text-center text-sm text-graphite" data-alb-empty>No hay albaranes que coincidan con el filtro.</div>
    <div class="px-5 py-3 bg-paper-2 border-t border-line text-xs flex justify-between flex-wrap gap-2 font-mono text-graphite" data-alb-footer>—</div>
  </div>
</main>
</div></section>
  <div data-component="site-footer"></div>

<script src="/assets/js/main.js"></script><script src="/assets/js/auth.js"></script>
<script>if(glxRequireAuth()){const u=glxGetUser();if(u.role!=='pro'){location.href='/pages/cuenta/area-personal.html';}else{document.querySelector('[data-current-name]') && (document.querySelector('[data-current-name]').textContent=u.name);const sb=document.getElementById('glx-sidebar');sb.innerHTML=glxRenderSidebar(sb.dataset.active);}}</script>
  <script src="/assets/js/component-loader.js"></script>
  <script src="/data/api.js"></script>
  <script src="/assets/js/backend-integration.js"></script>
  <script src="/assets/js/catalog-ui.js"></script>
  <script>
  (function () {
    const api = window.GarperLuxApi; if (!api) return;
    const money = (v) => `${Number(v||0).toFixed(2).replace('.', ',')} €`;
    const fmtDay = (iso) => { if (!iso) return ''; const d = new Date(iso.replace(' ','T')); return isNaN(d.getTime()) ? iso : d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }); };
    const periodKey = (iso) => { if (!iso) return ''; const d = new Date(iso.replace(' ','T')); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
    const periodLabel = (key) => { if (!key) return ''; const [y,m]=key.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}); };

    const list = document.querySelector('[data-alb-list]');
    const empty = document.querySelector('[data-alb-empty]');
    const footer = document.querySelector('[data-alb-footer]');
    const summary = document.querySelector('[data-alb-summary]');
    const searchInput = document.querySelector('[data-alb-search]');
    const periodSelect = document.querySelector('[data-alb-period]');
    const worksiteSelect = document.querySelector('[data-alb-worksite]');

    let all = [];
    let filterText = '';
    let filterPeriod = '';
    let filterWorksite = '';

    const sumItems = (alb) => (alb.payload?.items || []).reduce((s, it) => s + Number(it.quantity || 0), 0);

    const applyFilters = () => {
      const q = filterText.trim().toLowerCase();
      return all.filter((a) => {
        if (filterPeriod && periodKey(a.issued_at) !== filterPeriod) return false;
        if (filterWorksite && (a.payload?.worksite || '') !== filterWorksite) return false;
        if (q) {
          const hay = [a.code, a.payload?.worksite, a.payload?.customer, a.payload?.orderCode, ...(a.payload?.items||[]).map((it)=>it.sku+' '+it.name)].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    };

    const renderRow = (a) => {
      const items = a.payload?.items || [];
      const itemCount = sumItems(a);
      const concept = items[0]?.name || a.payload?.worksite || 'Albarán';
      const detail = items.length > 1 ? `${items.length} referencias · ${a.payload?.worksite || a.payload?.customer || ''}` : (a.payload?.worksite || a.payload?.customer || '');
      return `<a href="/pages/cuenta/albaran.html?code=${encodeURIComponent(a.code)}" class="px-5 py-3 grid grid-cols-[80px_140px_1fr_90px_110px] gap-3 items-center text-sm hover:bg-paper-2/50 cursor-pointer">
        <div class="font-mono text-xs text-graphite">${fmtDay(a.issued_at)}</div>
        <div class="font-mono font-medium">${a.code}</div>
        <div><div class="font-medium">${concept}</div><div class="text-xs text-graphite">${detail}</div></div>
        <div class="font-mono">${itemCount}</div>
        <div class="font-mono font-medium">${money(a.total)}</div>
      </a>`;
    };

    const render = () => {
      const filtered = applyFilters();
      list.innerHTML = filtered.map(renderRow).join('');
      empty.classList.toggle('hidden', filtered.length > 0);
      const totalFiltered = filtered.reduce((s,a)=>s+Number(a.total||0),0);
      footer.innerHTML = `<span>${filtered.length} de ${all.length} albaranes · <strong class="text-ink">Total filtrado ${money(totalFiltered)}</strong></span>`;
    };

    const computeStats = () => {
      if (!all.length) {
        summary.textContent = 'Aún no tienes albaranes.';
        ['data-alb-stat-month','data-alb-stat-month-sum','data-alb-stat-month-units','data-alb-stat-total'].forEach(k => document.querySelector(`[${k}]`).textContent = '—');
        return;
      }
      // Mes de referencia = mes del albarán más reciente
      const refMonth = periodKey(all[0].issued_at);
      const monthOnes = all.filter((a) => periodKey(a.issued_at) === refMonth);
      const totalSum = all.reduce((s,a)=>s+Number(a.total||0),0);
      const monthSum = monthOnes.reduce((s,a)=>s+Number(a.total||0),0);
      const monthUnits = monthOnes.reduce((s,a)=>s+sumItems(a),0);
      summary.textContent = `${all.length} albaran${all.length===1?'':'es'} · ${monthOnes.length} en ${periodLabel(refMonth)}`;
      document.querySelector('[data-alb-stat-month]').textContent = monthOnes.length;
      document.querySelector('[data-alb-stat-month-sum]').textContent = money(monthSum);
      document.querySelector('[data-alb-stat-month-units]').textContent = monthUnits;
      document.querySelector('[data-alb-stat-total]').textContent = money(totalSum);
    };

    const populateFilters = () => {
      const periods = [...new Set(all.map((a) => periodKey(a.issued_at)).filter(Boolean))];
      periodSelect.innerHTML = '<option value="">Todos los periodos</option>' + periods.map((k) => `<option value="${k}">${periodLabel(k).replace(/^./, c => c.toUpperCase())}</option>`).join('');
      const worksites = [...new Set(all.map((a) => a.payload?.worksite).filter(Boolean))];
      worksiteSelect.innerHTML = '<option value="">Todas las obras</option>' + worksites.map((w) => `<option value="${w}">${w}</option>`).join('');
    };

    const reload = async () => {
      try {
        all = await api.documents('delivery_note');
        populateFilters();
        computeStats();
        render();
      } catch (e) { glxToast(e.message); }
    };

    searchInput.addEventListener('input', (ev) => { filterText = ev.target.value; render(); });
    periodSelect.addEventListener('change', (ev) => { filterPeriod = ev.target.value; render(); });
    worksiteSelect.addEventListener('change', (ev) => { filterWorksite = ev.target.value; render(); });

    document.querySelector('[data-alb-export]').addEventListener('click', () => {
      const filtered = applyFilters();
      if (!filtered.length) { glxToast('No hay albaranes para exportar.'); return; }
      const header = ['Fecha','Albarán','Pedido','Obra','Cliente','Items','Total'];
      const rows = filtered.map((a) => [a.issued_at?.slice(0,10), a.code, a.payload?.orderCode||'', a.payload?.worksite||'', a.payload?.customer||'', sumItems(a), a.total]);
      const csv = [header, ...rows].map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g,'""')}"`).join(';')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'albaranes-garperlux.csv';
      document.body.appendChild(a); a.click(); a.remove();
    });

    document.addEventListener('garperlux:components-ready', () => {
      if (window.glxEnsureApiSession) window.glxEnsureApiSession().finally(reload);
      else reload();
    });
    if (api.getToken()) reload();
  })();
  </script>
</body></html>
