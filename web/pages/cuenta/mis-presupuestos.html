  <div data-component="site-header"></div>
<div class="container-x pt-5 pb-2"><nav class="text-xs font-mono text-graphite flex items-center gap-2"><a href="/index.html" class="hover:text-ink">Inicio</a><span class="opacity-50">/</span><a href="/pages/cuenta/area-personal.html" class="hover:text-ink">Mi área</a><span class="opacity-50">/</span><span class="text-ink">Mis presupuestos</span></nav></div>

<section class="container-x py-6 pb-20"><div class="grid lg:grid-cols-[280px_1fr] gap-8 lg:gap-10">
<aside id="glx-sidebar" class="lg:sticky lg:top-6 lg:self-start" data-active="mis-presupuestos"></aside>

<main>
  <div class="flex items-end justify-between flex-wrap gap-4 mb-8">
    <div><div class="eyebrow text-copper mb-2">Para tus clientes</div><h1 class="font-serif font-medium leading-[0.96]" style="font-size: clamp(2rem, 4.5vw, 3rem);">Mis presupuestos.</h1><p class="text-graphite mt-2" data-quote-summary>Cargando…</p></div>
    <a href="/pages/cuenta/crear-presupuesto.html" class="btn btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Crear presupuesto</a>
  </div>

  <!-- Tabs estado -->
  <div class="flex items-center gap-1 mb-6 border-b border-line overflow-x-auto" data-quote-tabs>
    <button class="tab-btn is-active" data-tab="open">Abiertos <span class="font-mono text-xs text-graphite ml-1" data-count-open>0</span></button>
    <button class="tab-btn" data-tab="accepted">Aceptados <span class="font-mono text-xs ml-1" data-count-accepted>0</span></button>
    <button class="tab-btn" data-tab="rejected">Rechazados <span class="font-mono text-xs ml-1" data-count-rejected>0</span></button>
    <button class="tab-btn" data-tab="draft">Borradores <span class="font-mono text-xs ml-1" data-count-draft>0</span></button>
    <button class="tab-btn" data-tab="all">Todos <span class="font-mono text-xs ml-1" data-count-all>0</span></button>
  </div>

  <!-- Lista -->
  <div class="space-y-4" data-quote-list></div>
  <div class="hidden text-center py-16 px-6 border border-dashed border-line rounded-2xl text-graphite" data-quote-empty>
    <p class="font-serif text-xl mb-2 text-ink">No hay presupuestos en este estado.</p>
    <p class="text-sm mb-5">Cambia de pestaña o crea uno nuevo para tu próxima obra.</p>
    <a href="/pages/cuenta/crear-presupuesto.html" class="btn btn-sm btn-primary">+ Crear presupuesto</a>
  </div>

  <!-- Cifras -->
  <div class="mt-10 grid grid-cols-2 md:grid-cols-4 gap-3">
    <div class="bg-paper-2 border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Tasa conversión</div><div class="font-serif text-2xl font-medium" data-stat-conversion>—</div></div>
    <div class="bg-paper-2 border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Importe medio</div><div class="font-serif text-2xl font-medium" data-stat-avg>—</div></div>
    <div class="bg-paper-2 border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Total enviado</div><div class="font-serif text-2xl font-medium" data-stat-total>—</div></div>
    <div class="bg-paper-2 border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Total aceptado</div><div class="font-serif text-2xl font-medium text-stock" data-stat-accepted>—</div></div>
  </div>
</main>
</div></section>
  <div data-component="site-footer"></div>

<script src="/assets/js/main.js"></script><script src="/assets/js/auth.js"></script>
<script>if(glxRequireAuth()){const u=glxGetUser();if(u.role!=='pro'){location.href='/pages/cuenta/area-personal.html';}else{document.querySelector('[data-current-name]') && (document.querySelector('[data-current-name]').textContent=u.name);const sb=document.getElementById('glx-sidebar');sb.innerHTML=glxRenderSidebar(sb.dataset.active);}}</script>
  <script src="/assets/js/component-loader.js"></script>
  <script src="/data/api.js"></script>
  <script src="/assets/js/backend-integration.js"></script>
  <script src="/assets/js/catalog-ui.js"></script>
  <script>
  (function () {
    const api = window.GarperLuxApi; if (!api) return;
    const money = (v) => `${Number(v||0).toFixed(2).replace('.', ',')} €`;
    const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso.replace(' ','T')); return isNaN(d.getTime()) ? iso : d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); };
    const daysAgo = (iso) => { if (!iso) return null; const d = new Date(iso.replace(' ','T')); return Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000)); };

    const STATUS_PILL = {
      sent: 'pill pill-caution',
      accepted: 'pill pill-stock',
      rejected: 'pill pill-warn',
      draft: 'pill pill-info',
    };
    const STATUS_LABEL = {
      sent: 'Esperando respuesta',
      accepted: 'Aceptado',
      rejected: 'Rechazado',
      draft: 'Borrador',
    };

    const list = document.querySelector('[data-quote-list]');
    const empty = document.querySelector('[data-quote-empty]');
    const summary = document.querySelector('[data-quote-summary]');
    const tabsBar = document.querySelector('[data-quote-tabs]');

    let all = [];
    let activeTab = 'open';

    const matchesTab = (q) => {
      if (activeTab === 'open') return q.status === 'sent';
      if (activeTab === 'accepted') return q.status === 'accepted';
      if (activeTab === 'rejected') return q.status === 'rejected';
      if (activeTab === 'draft') return q.status === 'draft';
      return true;
    };

    const renderCard = (q) => {
      const pill = STATUS_PILL[q.status] || 'pill pill-info';
      const label = STATUS_LABEL[q.status] || q.status;
      const days = daysAgo(q.created_at);
      const sentLabel = days != null ? `Enviado hace ${days} día${days === 1 ? '' : 's'}` : '';
      const items = q.payload?.items || [];
      const tags = items.slice(0, 3).map((it) => `<span class="pill bg-paper-2 text-graphite text-[10px]">${it.kind === 'product' ? `${it.name} · ${it.quantity} ud` : `${it.concept} · ${it.quantity}`}</span>`).join('');
      const validity = q.payload?.validityDays || 10;
      const dueDate = q.created_at ? new Date(new Date(q.created_at.replace(' ','T')).getTime() + validity * 86400000).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';

      return `<a href="/pages/cuenta/presupuesto.html?code=${encodeURIComponent(q.code)}" class="block bg-white border border-line rounded-2xl overflow-hidden hover:border-ink transition-colors">
        <div class="p-6">
          <div class="flex items-start justify-between flex-wrap gap-4">
            <div>
              <div class="flex items-center gap-2 mb-2 flex-wrap"><span class="font-mono text-xs text-graphite">${q.code}</span><span class="${pill} text-[10px]">${label}</span><span class="font-mono text-xs text-graphite">${sentLabel}</span></div>
              <h3 class="font-serif text-2xl font-medium leading-tight mb-1">${q.title}</h3>
              <p class="text-graphite text-sm">${q.payload?.customer?.address || q.payload?.description || ''}</p>
            </div>
            <div class="text-right">
              <div class="font-serif text-3xl font-medium">${money(q.total)}</div>
              <div class="text-xs text-graphite font-mono">Vence ${dueDate}</div>
            </div>
          </div>
          <div class="mt-5 pt-5 border-t border-line flex flex-wrap gap-2 justify-between items-center">
            <div class="flex flex-wrap gap-2">${tags || '<span class="text-xs text-graphite">Sin líneas todavía</span>'}</div>
            <div class="flex gap-2"><span class="text-xs text-graphite">${items.length} líneas</span></div>
          </div>
        </div>
      </a>`;
    };

    const render = () => {
      const filtered = all.filter(matchesTab);
      list.innerHTML = filtered.map(renderCard).join('');
      empty.classList.toggle('hidden', filtered.length > 0);
    };

    const updateTabs = () => {
      tabsBar.querySelectorAll('button').forEach((b) => b.classList.toggle('is-active', b.dataset.tab === activeTab));
    };

    const updateCounts = () => {
      const counts = { open: 0, accepted: 0, rejected: 0, draft: 0, all: all.length };
      all.forEach((q) => {
        if (q.status === 'sent') counts.open++;
        else if (q.status === 'accepted') counts.accepted++;
        else if (q.status === 'rejected') counts.rejected++;
        else if (q.status === 'draft') counts.draft++;
      });
      ['open','accepted','rejected','draft','all'].forEach((k) => { const el = document.querySelector(`[data-count-${k}]`); if (el) el.textContent = counts[k]; });
      summary.textContent = `${counts.open} abierto${counts.open===1?'':'s'} · ${counts.accepted} aceptado${counts.accepted===1?'':'s'} · ${counts.rejected} rechazado${counts.rejected===1?'':'s'}`;
    };

    const updateStats = () => {
      const closed = all.filter((q) => q.status === 'accepted' || q.status === 'rejected');
      const accepted = all.filter((q) => q.status === 'accepted');
      const sent = all.filter((q) => q.status !== 'draft');
      const conversion = closed.length ? Math.round((accepted.length / closed.length) * 100) : 0;
      const avg = sent.length ? sent.reduce((s,q)=>s+Number(q.total||0),0) / sent.length : 0;
      const total = sent.reduce((s,q)=>s+Number(q.total||0),0);
      const totalAccepted = accepted.reduce((s,q)=>s+Number(q.total||0),0);
      document.querySelector('[data-stat-conversion]').textContent = closed.length ? `${conversion}%` : '—';
      document.querySelector('[data-stat-avg]').textContent = sent.length ? money(avg) : '—';
      document.querySelector('[data-stat-total]').textContent = money(total);
      document.querySelector('[data-stat-accepted]').textContent = money(totalAccepted);
    };

    tabsBar.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-tab]');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      updateTabs();
      render();
    });

    const reload = async () => {
      try {
        const list = await api.quotes();
        // Para cada uno, traemos detalle (payload con items) en paralelo.
        all = await Promise.all(list.map(async (q) => {
          try { const detail = await api.quote(q.code); return { ...q, payload: detail.payload }; }
          catch { return q; }
        }));
        updateCounts();
        updateStats();
        render();
      } catch (e) { glxToast(e.message); }
    };

    document.addEventListener('garperlux:components-ready', () => {
      if (window.glxEnsureApiSession) window.glxEnsureApiSession().finally(reload);
      else reload();
    });
    if (api.getToken()) reload();
  })();
  </script>
</body></html>
