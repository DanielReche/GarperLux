<main>

    <select class="bg-white border border-line rounded-lg text-sm py-2.5 px-3 outline-none focus:border-ink" data-fac-period><option value="">Todos los periodos</option></select>

    <div class="bg-white border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Total facturado</div><div class="font-serif text-2xl font-medium" data-fac-stat-total>—</div></div>
    <div class="bg-white border border-line rounded-xl p-4"><div class="text-[10px] font-mono text-graphite uppercase tracking-wider mb-1">Pendientes pago</div><div class="font-serif text-2xl font-medium text-caution" data-fac-stat-pending>—</div></div>

<script src="/assets/js/main.js?v=20260611"></script><script src="/assets/js/auth.js?v=20260611"></script>
<script>if(glxRequireAuth()){const u=glxGetUser();if(u.role!=='pro'){location.href='/pages/cuenta/area-personal.html';}else{document.querySelector('[data-current-name]') && (document.querySelector('[data-current-name]').textContent=u.name);const sb=document.getElementById('glx-sidebar');sb.innerHTML=glxRenderSidebar(sb.dataset.active);}}</script>
  <script src="/assets/js/component-loader.js?v=20260611"></script>
  <script src="/data/api.js?v=20260611"></script>
  <script src="/assets/js/backend-integration.js?v=20260611"></script>
  <script src="/assets/js/catalog-ui.js?v=20260611"></script>
  <script>
  (function () {
    const api = window.GarperLuxApi; if (!api) return;
    const money = (v) => `${Number(v||0).toFixed(2).replace('.', ',')} €`;
    const fmtDay = (iso) => { if (!iso) return ''; const d = new Date(iso.replace(' ','T')); return isNaN(d.getTime()) ? iso : d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }); };
    const periodKey = (iso) => { if (!iso) return ''; const d = new Date(iso.replace(' ','T')); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
    const periodLabel = (key) => { if (!key) return ''; const [y,m]=key.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}); };

    const list = document.querySelector('[data-fac-list]');
    const empty = document.querySelector('[data-fac-empty]');
    const footer = document.querySelector('[data-fac-footer]');
    const summary = document.querySelector('[data-fac-summary]');
    const searchInput = document.querySelector('[data-fac-search]');
    const periodSelect = document.querySelector('[data-fac-period]');
    const statusSelect = document.querySelector('[data-fac-status]');

    let all = [];
    let filterText = '';
    let filterPeriod = '';
    let filterStatus = '';

    const applyFilters = () => {
      const q = filterText.trim().toLowerCase();
      return all.filter((f) => {
        const isPaid = !!f.payload?.paid;
        if (filterPeriod && periodKey(f.issued_at) !== filterPeriod) return false;
        if (filterStatus === 'paid' && !isPaid) return false;
        if (filterStatus === 'pending' && isPaid) return false;
        if (q) {
          const hay = [f.code, f.related_order_code, f.payload?.customer, f.payload?.worksite].filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    };

    const statusBadge = (f) => {
      if (f.payload?.paid) return '<span class="pill pill-stock text-[9px]">Pagada</span>';
      if (f.payload?.dueAt) return `<span class="pill pill-caution text-[9px]">Pendiente · vence ${fmtDay(f.payload.dueAt)}</span>`;
      return '<span class="pill pill-info text-[9px]">Pendiente</span>';
    };

    const renderRow = (f) => {
      const concept = f.payload?.worksite || (f.related_order_code ? `Pedido ${f.related_order_code}` : 'Factura');
      const detail = `${f.payload?.customer || ''} · ${statusBadge(f)}`;
      const base = Number(f.payload?.subtotal || 0);
      const tax = Number(f.payload?.tax || (base * 0.21));
      return `<a href="/pages/cuenta/factura.html?code=${encodeURIComponent(f.code)}" class="px-5 py-3 grid grid-cols-[80px_150px_1fr_110px_110px_110px] gap-3 items-center text-sm hover:bg-paper-2/50 cursor-pointer">
        <div class="font-mono text-xs text-graphite">${fmtDay(f.issued_at)}</div>
        <div class="font-mono font-medium">${f.code}</div>
        <div><div class="font-medium">${concept}</div><div class="text-xs text-graphite flex items-center gap-2 flex-wrap">${detail}</div></div>
        <div class="font-mono">${money(base)}</div>
        <div class="font-mono">${money(tax)}</div>
        <div class="font-mono font-medium">${money(f.total)}</div>
      </a>`;
    };

    const render = () => {
      const filtered = applyFilters();
      list.innerHTML = filtered.map(renderRow).join('');
      empty.classList.toggle('hidden', filtered.length > 0);
      const totalFiltered = filtered.reduce((s,f)=>s+Number(f.total||0),0);
      footer.innerHTML = `<span>${filtered.length} de ${all.length} facturas · <strong class="text-ink">Total filtrado ${money(totalFiltered)}</strong></span>`;
    };

    const computeStats = () => {
      if (!all.length) {
        summary.textContent = 'Aún no tienes facturas.';
        ['data-fac-stat-base','data-fac-stat-tax','data-fac-stat-total','data-fac-stat-pending'].forEach(k => document.querySelector(`[${k}]`).textContent = '—');
        return;
      }
      const totalBase = all.reduce((s,f)=>s+Number(f.payload?.subtotal||0),0);
      const totalTax = all.reduce((s,f)=>s+Number(f.payload?.tax||0),0);
      const totalSum = all.reduce((s,f)=>s+Number(f.total||0),0);
      const pending = all.filter((f)=>!f.payload?.paid);
      const recent = periodKey(all[0].issued_at);
      summary.textContent = `${all.length} factura${all.length===1?'':'s'} · ${all.filter(f=>periodKey(f.issued_at)===recent).length} en ${periodLabel(recent)}`;
      document.querySelector('[data-fac-stat-base]').textContent = money(totalBase);
      document.querySelector('[data-fac-stat-tax]').textContent = money(totalTax);
      document.querySelector('[data-fac-stat-total]').textContent = money(totalSum);
      document.querySelector('[data-fac-stat-pending]').textContent = pending.length;
    };

    const populateFilters = () => {
      const periods = [...new Set(all.map((f) => periodKey(f.issued_at)).filter(Boolean))];
      periodSelect.innerHTML = '<option value="">Todos los periodos</option>' + periods.map((k) => `<option value="${k}">${periodLabel(k).replace(/^./, c => c.toUpperCase())}</option>`).join('');
    };

    const reload = async () => {
      try {
        all = await api.documents('invoice');
        populateFilters();
        computeStats();
        render();
      } catch (e) { glxToast(e.message); }
    };

    searchInput.addEventListener('input', (ev) => { filterText = ev.target.value; render(); });
    periodSelect.addEventListener('change', (ev) => { filterPeriod = ev.target.value; render(); });
    statusSelect.addEventListener('change', (ev) => { filterStatus = ev.target.value; render(); });

    document.querySelector('[data-fac-export]').addEventListener('click', () => {
      const filtered = applyFilters();
      if (!filtered.length) { glxToast('No hay facturas para exportar.'); return; }
      const header = ['Fecha','Factura','Pedido','Cliente','Base','IVA','Total','Estado'];
      const rows = filtered.map((f) => [f.issued_at?.slice(0,10), f.code, f.related_order_code||'', f.payload?.customer||'', f.payload?.subtotal||0, f.payload?.tax||0, f.total, f.payload?.paid?'pagada':'pendiente']);
      const csv = [header, ...rows].map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g,'""')}"`).join(';')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'facturas-garperlux.csv';
      document.body.appendChild(a); a.click(); a.remove();
    });

    document.addEventListener('garperlux:components-ready', () => {
      if (window.glxEnsureApiSession) window.glxEnsureApiSession().finally(reload);
      else reload();
    });
    if (api.getToken()) reload();
  })();
  </script>
