<!DOCTYPE html>
<html lang="es"><head>
  <base href="/.">
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Presupuesto · Mi área · GarperLux</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/img/favicon.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#0B0D12','ink-soft':'#1C1F26',graphite:'#40454F',paper:'#F7F3EC','paper-2':'#EFE9DE','paper-3':'#E4DCCA',line:'#E5DED0',filament:'#E8A545','filament-glow':'#FFC878',copper:'#B8753A',electric:'#1E3A8A',stock:'#16A34A',warn:'#DC2626',caution:'#D97706'},fontFamily:{serif:['Fraunces','Georgia','serif'],sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}};</script>
<link rel="stylesheet" href="/assets/css/styles.css?v=20260611" />
<style>.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;border-radius:8px;font-size:14px;color:var(--graphite);transition:all .15s}.nav-item:hover{background:var(--paper-2);color:var(--ink)}.nav-item.is-active{background:var(--ink);color:var(--paper);font-weight:500}.doc-grid{font-variant-numeric:tabular-nums}@media print{.no-print{display:none !important}}</style>
</head>
<body class="bg-paper text-ink">
  <div data-component="site-header"></div>

<div class="container-x pt-5 pb-2"><nav class="text-xs font-mono text-graphite flex items-center gap-2 flex-wrap"><a href="/index.html" class="hover:text-ink">Inicio</a><span class="opacity-50">/</span><a href="/pages/cuenta/area-personal.html" class="hover:text-ink">Mi área</a><span class="opacity-50">/</span><a href="/pages/cuenta/mis-presupuestos.html" class="hover:text-ink">Mis presupuestos</a><span class="opacity-50">/</span><span class="text-ink" data-quote-bread>—</span></nav></div>

<section class="container-x py-6 pb-20"><div class="grid lg:grid-cols-[280px_1fr] gap-8 lg:gap-10">
<aside id="glx-sidebar" class="lg:sticky lg:top-6 lg:self-start no-print" data-active="mis-presupuestos"></aside>

<main class="space-y-6" data-quote-main>
  <div class="bg-white border border-line rounded-2xl p-8 text-center text-sm text-graphite">Cargando presupuesto…</div>
</main>
</div></section>
  <div data-component="site-footer"></div>

<script src="/assets/js/main.js?v=20260611"></script><script src="/assets/js/auth.js?v=20260611"></script>
<script>if(glxRequireAuth()){const u=glxGetUser();if(u.role!=='pro'){location.href='/pages/cuenta/area-personal.html';}else{document.querySelector('[data-current-name]') && (document.querySelector('[data-current-name]').textContent=u.name);const sb=document.getElementById('glx-sidebar');sb.innerHTML=glxRenderSidebar(sb.dataset.active);}}</script>
  <script src="/assets/js/component-loader.js?v=20260611"></script>
  <script src="/data/api.js?v=20260611"></script>
  <script src="/assets/js/backend-integration.js?v=20260611"></script>
  <script src="/assets/js/catalog-ui.js?v=20260611"></script>
  <script>
  (function () {
    const api = window.GarperLuxApi; if (!api) return;
    const money = (v) => `${Number(v||0).toFixed(2).replace('.', ',')} €`;
    const fmtDate = (iso) => { if (!iso) return '—'; const d = new Date(iso.replace(' ','T')); return isNaN(d.getTime()) ? iso : d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); };
    const daysBetween = (iso) => { if (!iso) return null; const d = new Date(iso.replace(' ','T')); return Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000)); };

    const STATUS_PILL = { sent: 'pill pill-caution', accepted: 'pill pill-stock', rejected: 'pill pill-warn', draft: 'pill pill-info' };
    const STATUS_LABEL = { sent: 'Esperando respuesta', accepted: 'Aceptado', rejected: 'Rechazado', draft: 'Borrador' };
    const STAGE_INDEX = { draft: 0, sent: 1, accepted: 3, rejected: 3 };

    const main = document.querySelector('[data-quote-main]');
    const bread = document.querySelector('[data-quote-bread]');

    const renderTracking = (q) => {
      const stages = ['Borrador', 'Enviado', 'Esperando', q.status === 'rejected' ? 'Rechazado' : 'Aceptado'];
      const current = STAGE_INDEX[q.status] ?? 0;
      const sentAt = q.status !== 'draft' ? q.created_at : null;
      const days = sentAt ? daysBetween(sentAt) : null;
      const lineWidth = (current / (stages.length - 1)) * 100;
      return `<div class="bg-white border border-line rounded-2xl p-6">
        <div class="grid grid-cols-${stages.length} relative">
          <div class="absolute top-3 left-[12.5%] right-[12.5%] h-px bg-line z-0"></div>
          <div class="absolute top-3 left-[12.5%] h-px bg-stock z-10" style="width:${Math.max(0, lineWidth - 12.5)}%;"></div>
          ${stages.map((label, idx) => {
            const reached = idx <= current;
            const isCurrent = idx === current;
            const cls = reached
              ? (isCurrent && q.status === 'sent' ? 'bg-filament text-ink animate-pulse' : (q.status === 'rejected' && idx === current ? 'bg-warn text-paper' : 'bg-stock text-paper'))
              : 'bg-paper-2 border border-line';
            const ico = reached && !(isCurrent && q.status === 'sent') ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>' : (isCurrent && q.status === 'sent' ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' : '');
            const sub = idx === 1 && sentAt ? `<div class="text-[10px] font-mono text-graphite">${fmtDate(sentAt)}</div>` : (idx === 2 && days != null ? `<div class="text-[10px] font-mono text-filament">${days} día${days===1?'':'s'}</div>` : '');
            return `<div class="relative text-center"><span class="block w-6 h-6 rounded-full grid place-items-center mx-auto z-20 relative ${cls}">${ico}</span><div class="text-xs font-medium mt-2 ${reached ? '' : 'text-graphite'}">${label}</div>${sub}</div>`;
          }).join('')}
        </div>
      </div>`;
    };

    const renderLine = (line) => {
      if (line.kind === 'product') {
        return `<div class="grid grid-cols-[1fr_60px_90px_100px] gap-3 py-3 text-sm items-baseline">
          <div><div class="font-medium">${line.name}</div><div class="text-xs text-graphite font-mono">SKU ${line.sku}</div></div>
          <div class="text-right font-mono">${line.quantity}</div>
          <div class="text-right font-mono">${money(line.unitPrice)}</div>
          <div class="text-right font-mono font-medium">${money(line.lineTotal)}</div>
        </div>`;
      }
      return `<div class="grid grid-cols-[1fr_60px_90px_100px] gap-3 py-3 text-sm items-baseline">
        <div><div class="font-medium">${line.concept}</div><div class="text-xs text-graphite font-mono">${line.note || 'Línea libre'}</div></div>
        <div class="text-right font-mono">${line.quantity}</div>
        <div class="text-right font-mono">${money(line.unitPrice)}</div>
        <div class="text-right font-mono font-medium">${money(line.lineTotal)}</div>
      </div>`;
    };

    const render = (q) => {
      const p = q.payload || {};
      const items = p.items || [];
      const subtotal = Number(p.subtotal || items.reduce((s,it)=>s+Number(it.lineTotal||0),0));
      const tax = Number(p.tax || subtotal * 0.21);
      const total = Number(q.total || subtotal + tax);
      const validity = p.validityDays || 10;
      const dueDate = q.created_at ? new Date(new Date(q.created_at.replace(' ','T')).getTime() + validity * 86400000) : null;
      const dueLeft = dueDate ? Math.round((dueDate.getTime() - Date.now()) / 86400000) : null;

      bread.textContent = q.code;
      document.title = `Presupuesto ${q.code} · Mi área · GarperLux`;

      const materialTotal = items.filter(it => it.kind === 'product').reduce((s,it)=>s+Number(it.lineTotal||0),0);
      const laborTotal = items.filter(it => it.kind === 'free').reduce((s,it)=>s+Number(it.lineTotal||0),0);

      const customer = p.customer || {};

      main.innerHTML = `
        <div class="flex items-end justify-between flex-wrap gap-4">
          <div>
            <a href="/pages/cuenta/mis-presupuestos.html" class="text-sm text-graphite hover:text-ink flex items-center gap-2 mb-3 no-print"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Volver a presupuestos</a>
            <div class="flex items-center gap-3 mb-2 flex-wrap"><span class="font-mono text-sm text-graphite">Presupuesto</span><span class="font-mono font-medium text-ink">${q.code}</span><span class="${STATUS_PILL[q.status] || 'pill pill-info'} text-[10px]">${STATUS_LABEL[q.status] || q.status}</span></div>
            <h1 class="font-serif font-medium leading-[0.96]" style="font-size: clamp(1.75rem, 4vw, 2.75rem);">${q.title}.</h1>
            <p class="text-graphite mt-2">${q.created_at ? `Enviado el ${fmtDate(q.created_at)}` : 'Borrador'}${dueDate ? ` · vence el <strong class="text-ink">${fmtDate(dueDate.toISOString())}</strong>${dueLeft != null ? ` (en ${dueLeft} días)` : ''}` : ''}</p>
          </div>
          <div class="flex gap-2 flex-wrap no-print">
            <button class="btn btn-sm btn-ghost" data-quote-print><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Imprimir</button>
            ${q.status === 'sent' ? '<button class="btn btn-sm btn-ghost" data-quote-resend>Reenviar</button>' : ''}
            ${q.status !== 'rejected' ? '<a class="btn btn-sm btn-ink" href="/pages/cuenta/crear-presupuesto.html?duplicate=' + encodeURIComponent(q.code) + '">Duplicar</a>' : ''}
          </div>
        </div>

        ${renderTracking(q)}

        <div class="bg-white border border-line rounded-2xl p-8 md:p-10 doc-grid">
          <div class="flex items-start justify-between flex-wrap gap-4 pb-6 border-b border-line">
            <div>
              <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-2">Presupuesto</div>
              <div class="font-mono text-2xl font-medium">${q.code}</div>
            </div>
            <div class="text-right">
              <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-1">Validez</div>
              <div class="font-medium">${validity} días desde emisión</div>
              <div class="text-xs text-graphite font-mono">Vence ${fmtDate(dueDate?.toISOString())}</div>
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-6 py-6 border-b border-line">
            <div>
              <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-2">Emite</div>
              <div class="text-sm leading-relaxed">
                <strong>Jose Luis García - El Chispas Instalaciones</strong><br/>
                Carnet BT-123456-AND vigente<br/>
                CIF B12345678<br/>
                Polígono Los Olivares, nave 24 · 23009 Jaén<br/>
                <span class="font-mono">chispas@instaladoreseljaen.es · 600 333 444</span>
              </div>
            </div>
            <div>
              <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-2">Para</div>
              <div class="text-sm leading-relaxed">
                <strong>${customer.name || '—'}</strong><br/>
                ${customer.contact || ''}<br/>
                ${customer.address || ''}<br/>
                <span class="font-mono">${customer.email || ''}${customer.email && customer.phone ? ' · ' : ''}${customer.phone || ''}</span>
              </div>
            </div>
          </div>

          <div class="py-6 border-b border-line">
            <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-2">Concepto del trabajo</div>
            <p class="text-sm leading-relaxed">${p.description || 'Sin descripción.'}</p>
          </div>

          <div class="py-6">
            <div class="grid grid-cols-[1fr_60px_90px_100px] gap-3 pb-3 border-b border-line text-[10px] font-mono uppercase tracking-wider text-graphite">
              <span>Concepto</span><span class="text-right">Cant.</span><span class="text-right">Precio</span><span class="text-right">Importe</span>
            </div>
            <div class="divide-y divide-line">${items.length ? items.map(renderLine).join('') : '<p class="text-sm text-graphite py-4">Borrador sin líneas todavía.</p>'}</div>
          </div>

          <div class="grid md:grid-cols-2 gap-5 pt-2">
            <div class="text-sm text-graphite leading-relaxed">
              <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-2">Condiciones</div>
              ${p.conditions?.length ? `<ul class="space-y-1.5 text-sm">${p.conditions.map(c => `<li>· ${c}</li>`).join('')}</ul>` : '<p class="text-sm">Sin condiciones específicas.</p>'}
            </div>
            <div class="bg-paper-2 rounded-xl p-5 space-y-2 text-sm">
              ${materialTotal ? `<div class="flex justify-between"><span class="text-graphite">Material</span><span class="font-mono">${money(materialTotal)}</span></div>` : ''}
              ${laborTotal ? `<div class="flex justify-between"><span class="text-graphite">Mano de obra y servicios</span><span class="font-mono">${money(laborTotal)}</span></div>` : ''}
              <div class="flex justify-between font-medium"><span>Base imponible</span><span class="font-mono">${money(subtotal)}</span></div>
              <div class="flex justify-between"><span class="text-graphite">IVA 21%</span><span class="font-mono">${money(tax)}</span></div>
              <div class="pt-3 border-t border-line/60 flex justify-between font-medium"><span>Total presupuesto</span><span class="font-serif text-2xl">${money(total)}</span></div>
            </div>
          </div>
        </div>`;

      document.querySelector('[data-quote-print]')?.addEventListener('click', () => window.print());
      document.querySelector('[data-quote-resend]')?.addEventListener('click', () => glxToast('Presupuesto reenviado al cliente (demo).'));
    };

    const renderError = (msg) => {
      main.innerHTML = `<div class="bg-white border border-line rounded-2xl p-10 text-center"><p class="font-serif text-xl mb-2">${msg}</p><a href="/pages/cuenta/mis-presupuestos.html" class="link-underline">Volver a presupuestos</a></div>`;
    };

    const reload = async () => {
      const code = new URLSearchParams(location.search).get('code');
      try {
        if (code) { render(await api.quote(code)); return; }
        const list = await api.quotes();
        if (!list.length) { renderError('Aún no tienes presupuestos.'); return; }
        render(await api.quote(list[0].code));
      } catch (e) {
        if (e.code === 'QUOTE_NOT_FOUND') renderError('Presupuesto no encontrado.');
        else { glxToast(e.message); renderError(e.message); }
      }
    };

    document.addEventListener('garperlux:components-ready', () => {
      if (window.glxEnsureApiSession) window.glxEnsureApiSession().finally(reload);
      else reload();
    });
    if (api.getToken()) reload();
  })();
  </script>
</body></html>
