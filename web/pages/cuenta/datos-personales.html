<!DOCTYPE html>
<html lang="es"><head>
  <base href="/.">
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Datos personales · Mi área · GarperLux</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#0B0D12','ink-soft':'#1C1F26',graphite:'#40454F',paper:'#F7F3EC','paper-2':'#EFE9DE','paper-3':'#E4DCCA',line:'#E5DED0',filament:'#E8A545','filament-glow':'#FFC878',copper:'#B8753A',electric:'#1E3A8A',stock:'#16A34A',warn:'#DC2626'},fontFamily:{serif:['Fraunces','Georgia','serif'],sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}};</script>
<link rel="stylesheet" href="/assets/css/styles.css" />
<style>.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;border-radius:8px;font-size:14px;color:var(--graphite);transition:all .15s}.nav-item:hover{background:var(--paper-2);color:var(--ink)}.nav-item.is-active{background:var(--ink);color:var(--paper);font-weight:500}.field{width:100%;padding:.75rem .9rem;background:white;border:1.5px solid var(--line);border-radius:10px;font-size:14px;color:var(--ink)}.field:focus{outline:none;border-color:var(--ink)}</style>
</head>
<body class="bg-paper text-ink">
  <div data-component="site-header"></div>
<div class="container-x pt-5 pb-2"><nav class="text-xs font-mono text-graphite flex items-center gap-2"><a href="/index.html" class="hover:text-ink">Inicio</a><span class="opacity-50">/</span><a href="/pages/cuenta/area-personal.html" class="hover:text-ink">Mi área</a><span class="opacity-50">/</span><span class="text-ink">Datos personales</span></nav></div>

<section class="container-x py-6 pb-20"><div class="grid lg:grid-cols-[280px_1fr] gap-8 lg:gap-10">
<aside id="glx-sidebar" class="lg:sticky lg:top-6 lg:self-start" data-active="datos-personales"></aside>

<main class="max-w-3xl">
  <form id="profile-form" class="space-y-5">
  <div class="mb-8"><div class="eyebrow text-copper mb-2">Configuración</div><h1 class="font-serif font-medium leading-[0.96]" style="font-size: clamp(2rem, 4.5vw, 3rem);">Datos personales.</h1></div>

  <div class="bg-paper-2 border border-line rounded-2xl p-5 mb-5">
    <div class="flex items-center justify-between gap-4 flex-wrap">
      <div>
        <div class="text-xs font-mono uppercase tracking-wider text-graphite mb-1">Perfil guardado</div>
        <div id="profile-full-name-badge" class="font-serif text-xl font-medium">Cargando...</div>
      </div>
      <div id="profile-email-badge" class="text-xs font-mono text-graphite"></div>
    </div>
  </div>

  <!-- Identidad -->
  <div class="bg-white border border-line rounded-2xl p-6 mb-5">
    <h2 class="font-serif text-xl font-medium mb-5">Identidad</h2>
    <div class="grid sm:grid-cols-2 gap-4">
      <div><label class="text-xs font-mono text-graphite uppercase tracking-wider mb-1.5 block">Nombre</label><input id="profile-first-name" name="firstName" type="text" class="field" placeholder="Nombre"/></div>
      <div><label class="text-xs font-mono text-graphite uppercase tracking-wider mb-1.5 block">Apellidos</label><input id="profile-last-name" name="lastName" type="text" class="field" placeholder="Apellidos"/></div>
      <div><label class="text-xs font-mono text-graphite uppercase tracking-wider mb-1.5 block">DNI / NIE</label><input id="profile-fiscal-id" name="fiscalId" type="text" class="field font-mono" placeholder="12345678X"/></div>
      <div><label class="text-xs font-mono text-graphite uppercase tracking-wider mb-1.5 block">Fecha de nacimiento</label><input id="profile-birth-date" name="birthDate" type="date" class="field font-mono"/></div>
    </div>
  </div>

  <!-- Contacto -->
  <div class="bg-white border border-line rounded-2xl p-6 mb-5">
    <h2 class="font-serif text-xl font-medium mb-5">Contacto</h2>
    <div class="space-y-4">
      <div><label class="text-xs font-mono text-graphite uppercase tracking-wider mb-1.5 block">Email</label><div class="flex gap-2"><input id="profile-email" name="email" type="email" class="field flex-1" placeholder="nombre@correo.com"/><span class="pill pill-stock self-center text-[10px]">Verificado</span></div></div>
      <div><label class="text-xs font-mono text-graphite uppercase tracking-wider mb-1.5 block">Teléfono</label><div class="flex gap-2"><input id="profile-phone" name="phone" type="tel" class="field flex-1 font-mono" placeholder="600 123 456"/><span class="pill pill-stock self-center text-[10px]">Verificado</span></div></div>
    </div>
  </div>

  <!-- Preferencias -->
  <div class="bg-white border border-line rounded-2xl p-6 mb-5">
    <h2 class="font-serif text-xl font-medium mb-5">Comunicaciones</h2>
    <div class="space-y-4">
      <label class="flex items-start gap-3 cursor-pointer"><input id="profile-order-notifications" name="orderNotifications" type="checkbox" class="w-4 h-4 mt-1"/><div><div class="font-medium text-sm">Email de seguimiento de pedidos y solicitudes</div><div class="text-xs text-graphite">Confirmaciones, cambios de estado, llegada del pedido</div></div></label>
      <label class="flex items-start gap-3 cursor-pointer"><input id="profile-marketing-email" name="marketingEmail" type="checkbox" class="w-4 h-4 mt-1"/><div><div class="font-medium text-sm">Newsletter mensual con novedades y ofertas</div><div class="text-xs text-graphite">Una vez al mes, prometido</div></div></label>
      <label class="flex items-start gap-3 cursor-pointer"><input id="profile-tutorial-reminders" name="tutorialReminders" type="checkbox" class="w-4 h-4 mt-1"/><div><div class="font-medium text-sm">Recordatorios de tutoriales sin terminar</div><div class="text-xs text-graphite">Si dejas a medias un tutorial, te lo recordamos a la semana</div></div></label>
      <label class="flex items-start gap-3 cursor-pointer"><input id="profile-sms-urgency" name="smsUrgency" type="checkbox" class="w-4 h-4 mt-1"/><div><div class="font-medium text-sm">SMS solo para urgencias técnicas</div><div class="text-xs text-graphite">Únicamente si tienes un servicio técnico programado</div></div></label>
    </div>
  </div>

  <!-- Contraseña -->
  <div class="bg-white border border-line rounded-2xl p-6 mb-5">
    <h2 class="font-serif text-xl font-medium mb-5">Contraseña</h2>
    <p id="profile-password-hint" class="text-sm text-graphite mb-4">Cargando último cambio...</p>
    <a href="/pages/auth/recuperar-password.html" class="btn btn-ghost btn-sm">Cambiar contraseña</a>
  </div>

  <!-- Acciones -->
  <div class="flex justify-between flex-wrap gap-4 mt-8">
    <div class="flex gap-2"><button type="submit" class="btn btn-primary">Guardar cambios</button><button id="profile-cancel" type="button" class="btn btn-ghost btn-sm">Cancelar</button></div>
    <button type="button" class="text-sm text-warn hover:underline">Borrar mi cuenta</button>
  </div>
  </form>
</main>
</div></section>
  <div data-component="site-footer"></div>

<script src="/assets/js/component-loader.js"></script>
<script src="/data/api.js"></script>
<script src="/assets/js/backend-integration.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/catalog-ui.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/profile-integration.js"></script>
</body></html>
