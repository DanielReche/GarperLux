<!DOCTYPE html>
<html lang="es"><head>
  <base href="/.">
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Albarán · Mi área · GarperLux</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#0B0D12','ink-soft':'#1C1F26',graphite:'#40454F',paper:'#F7F3EC','paper-2':'#EFE9DE','paper-3':'#E4DCCA',line:'#E5DED0',filament:'#E8A545','filament-glow':'#FFC878',copper:'#B8753A',electric:'#1E3A8A',stock:'#16A34A',warn:'#DC2626',caution:'#D97706'},fontFamily:{serif:['Fraunces','Georgia','serif'],sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}};</script>
<link rel="stylesheet" href="/assets/css/styles.css" />
<style>.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;border-radius:8px;font-size:14px;color:var(--graphite);transition:all .15s}.nav-item:hover{background:var(--paper-2);color:var(--ink)}.nav-item.is-active{background:var(--ink);color:var(--paper);font-weight:500}.doc-grid{font-variant-numeric:tabular-nums}@media print{.no-print{display:none !important}}</style>
</head>
<body class="bg-paper text-ink">
  <div data-component="site-header"></div>

<div class="container-x pt-5 pb-2"><nav class="text-xs font-mono text-graphite flex items-center gap-2 flex-wrap"><a href="/index.html" class="hover:text-ink">Inicio</a><span class="opacity-50">/</span><a href="/pages/cuenta/area-personal.html" class="hover:text-ink">Mi área</a><span class="opacity-50">/</span><a href="/pages/cuenta/albaranes.html" class="hover:text-ink">Albaranes</a><span class="opacity-50">/</span><span class="text-ink" data-alb-bread>—</span></nav></div>

<section class="container-x py-6 pb-20"><div class="grid lg:grid-cols-[280px_1fr] gap-8 lg:gap-10">
<aside id="glx-sidebar" class="lg:sticky lg:top-6 lg:self-start no-print" data-active="albaranes"></aside>

<main class="space-y-6" data-alb-main>
  <div class="bg-white border border-line rounded-2xl p-8 text-center text-sm text-graphite">Cargando albarán…</div>
</main>
</div></section>
  <div data-component="site-footer"></div>

<script src="/assets/js/main.js"></script><script src="/assets/js/auth.js"></script>
<script>if(glxRequireAuth()){const u=glxGetUser();if(u.role!=='pro'){location.href='/pages/cuenta/area-personal.html';}else{document.querySelector('[data-current-name]') && (document.querySelector('[data-current-name]').textContent=u.name);const sb=document.getElementById('glx-sidebar');sb.innerHTML=glxRenderSidebar(sb.dataset.active);}}</script>
  <script src="/assets/js/component-loader.js"></script>
  <script src="/data/api.js"></script>
  <script src="/assets/js/backend-integration.js"></script>
  <script src="/assets/js/catalog-ui.js"></script>
  <script>
  (function () {
    const api = window.GarperLuxApi; if (!api) return;
    const money = (v) => `${Number(v||0).toFixed(2).replace('.', ',')} €`;
    const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso.replace(' ','T')); return isNaN(d.getTime()) ? iso : d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}); };
    const fmtTime = (iso) => { if (!iso) return ''; const d = new Date(iso.replace(' ','T')); return isNaN(d.getTime()) ? '' : d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); };

    const main = document.querySelector('[data-alb-main]');
    const bread = document.querySelector('[data-alb-bread]');

    const render = (alb) => {
      const p = alb.payload || {};
      const items = p.items || [];
      const totalQty = items.reduce((s,it)=>s+Number(it.quantity||0),0);
      const subtotalPro = items.reduce((s,it)=>s+Number(it.proPrice ?? it.price ?? 0)*Number(it.quantity||0),0);
      const subtotalOriginal = items.reduce((s,it)=>s+Number(it.price ?? 0)*Number(it.quantity||0),0);
      const savings = Math.max(0, subtotalOriginal - subtotalPro);
      bread.textContent = alb.code;
      document.title = `Albarán ${alb.code} · Mi área · GarperLux`;

      const itemsHtml = items.map((it) => `
        <div class="grid grid-cols-[1fr_70px_90px_90px_90px] gap-3 py-3 text-sm items-baseline">
          <div><div class="font-medium">${it.name}</div><div class="text-xs text-graphite font-mono">SKU ${it.sku}</div></div>
          <div class="text-right font-mono">${it.quantity}</div>
          <div class="text-right font-mono text-graphite line-through">${money(it.price)}</div>
          <div class="text-right font-mono text-stock">${it.proPrice && it.proPrice !== it.price ? '−' + Math.round((1 - it.proPrice/it.price)*100) + '%' : '—'}</div>
          <div class="text-right font-mono font-medium">${money((it.proPrice ?? it.price) * it.quantity)}</div>
        </div>`).join('');

      const statusPill = p.status === 'delivered' ? '<span class="pill pill-stock text-[10px]">Entregado</span>' : '<span class="pill pill-info text-[10px]">En curso</span>';

      main.innerHTML = `
        <div class="flex items-end justify-between flex-wrap gap-4">
          <div>
            <a href="/pages/cuenta/albaranes.html" class="text-sm text-graphite hover:text-ink flex items-center gap-2 mb-3 no-print"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Volver a albaranes</a>
            <div class="flex items-center gap-3 mb-2 flex-wrap">
              <span class="font-mono text-sm text-graphite">Albarán</span>
              <span class="font-mono font-medium text-ink">${alb.code}</span>
              ${statusPill}
            </div>
            <h1 class="font-serif font-medium leading-[0.96]" style="font-size: clamp(1.75rem, 4vw, 2.75rem);">${p.worksite || 'Albarán de entrega'}.</h1>
            <p class="text-graphite mt-2">Emitido ${fmtDate(alb.issued_at)} · obra <strong class="text-ink">${p.worksite || '—'}</strong></p>
          </div>
          <div class="flex gap-2 flex-wrap no-print">
            <button class="btn btn-sm btn-ghost" data-alb-print><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>Imprimir</button>
            ${p.orderCode ? `<a href="/pages/cuenta/mis-pedido.html?order=${encodeURIComponent(p.orderCode)}" class="btn btn-sm btn-ghost">Ver pedido</a>` : ''}
            <a href="/pages/cuenta/factura.html?related=${encodeURIComponent(alb.code)}" class="btn btn-sm btn-ink">Factura asociada</a>
          </div>
        </div>

        <div class="bg-white border border-line rounded-2xl p-8 md:p-10 doc-grid">
          <div class="grid md:grid-cols-2 gap-6 pb-6 border-b border-line">
            <div>
              <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-2">Emitido por</div>
              <div class="text-sm leading-relaxed">
                <strong>GarperLux S.L.</strong><br/>
                CIF: B-23456789<br/>
                Campus Las Lagunillas s/n · 23071 Jaén<br/>
                953 21 22 23 · hola@garperlux.es
              </div>
            </div>
            <div>
              <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-2">Cliente</div>
              <div class="text-sm leading-relaxed">
                <strong>${p.customer || 'Cliente'}</strong><br/>
                ${p.address || ''}
              </div>
            </div>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-5 py-6 border-b border-line">
            <div><div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-1">Nº albarán</div><div class="font-mono font-medium">${alb.code}</div></div>
            <div><div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-1">Fecha emisión</div><div class="font-mono">${fmtDate(alb.issued_at)} ${fmtTime(alb.issued_at)}</div></div>
            <div><div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-1">Pedido relacionado</div>${p.orderCode ? `<a href="/pages/cuenta/mis-pedido.html?order=${encodeURIComponent(p.orderCode)}" class="font-mono text-copper hover:underline">${p.orderCode}</a>` : '<span class="text-graphite">—</span>'}</div>
            <div><div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-1">Obra</div><div class="font-medium">${p.worksite || '—'}</div></div>
          </div>
          <div class="py-6">
            <div class="grid grid-cols-[1fr_70px_90px_90px_90px] gap-3 pb-3 border-b border-line text-[10px] font-mono uppercase tracking-wider text-graphite">
              <span>Concepto</span><span class="text-right">Cant.</span><span class="text-right">PVP</span><span class="text-right">Dto. pro</span><span class="text-right">Importe</span>
            </div>
            <div class="divide-y divide-line">${itemsHtml || '<p class="text-sm text-graphite py-4">Sin líneas.</p>'}</div>
          </div>
          <div class="grid md:grid-cols-2 gap-5 pt-2">
            <div class="text-sm text-graphite leading-relaxed">
              <div class="text-[10px] font-mono uppercase tracking-wider text-graphite mb-2">Notas</div>
              ${p.signedBy ? `<p>Mercancía recibida y firmada por <strong>${p.signedBy}</strong> el ${fmtDate(p.signedAt || alb.issued_at)}.</p>` : '<p>Pendiente de firma de recepción.</p>'}
              <p class="mt-3 font-mono text-xs">${totalQty} unidades en ${items.length} línea${items.length === 1 ? '' : 's'}</p>
            </div>
            <div class="bg-paper-2 rounded-xl p-5 space-y-2 text-sm">
              <div class="flex justify-between"><span class="text-graphite">Subtotal pro</span><span class="font-mono">${money(subtotalPro)}</span></div>
              <div class="flex justify-between"><span class="text-graphite">Portes</span><span class="font-mono text-stock">Gratis</span></div>
              ${savings > 0 ? `<div class="flex justify-between text-xs text-graphite italic"><span>Has ahorrado</span><span class="font-mono">${money(savings)}</span></div>` : ''}
              <div class="pt-3 border-t border-line/60 flex justify-between font-medium"><span>Total albarán <span class="text-xs text-graphite font-normal">(sin IVA)</span></span><span class="font-serif text-2xl">${money(alb.total)}</span></div>
            </div>
          </div>
        </div>

        <div class="bg-paper-2 border border-line rounded-2xl p-5 flex items-center justify-between flex-wrap gap-3 no-print">
          <div class="text-sm text-graphite">El IVA se aplicará al emitir la factura asociada.</div>
          <div class="flex gap-2">
            ${p.orderCode ? `<a href="/pages/cuenta/repetir-compra.html" class="btn btn-sm btn-ghost">Duplicar como pedido</a>` : ''}
            <a href="/pages/empresa/contacto.html" class="btn btn-sm btn-ghost">Reportar incidencia</a>
          </div>
        </div>`;

      document.querySelector('[data-alb-print]')?.addEventListener('click', () => window.print());
    };

    const renderError = (msg) => {
      main.innerHTML = `<div class="bg-white border border-line rounded-2xl p-10 text-center"><p class="font-serif text-xl mb-2">${msg}</p><a href="/pages/cuenta/albaranes.html" class="link-underline">Volver a albaranes</a></div>`;
    };

    const reload = async () => {
      const code = new URLSearchParams(location.search).get('code');
      try {
        if (code) { render(await api.document(code)); return; }
        // Sin código en URL: cargar el último albarán disponible
        const list = await api.documents('delivery_note');
        if (!list.length) { renderError('Aún no tienes albaranes.'); return; }
        render(await api.document(list[0].code));
      } catch (e) {
        if (e.code === 'DOCUMENT_NOT_FOUND') renderError('Albarán no encontrado.');
        else { glxToast(e.message); renderError(e.message); }
      }
    };

    document.addEventListener('garperlux:components-ready', () => {
      if (window.glxEnsureApiSession) window.glxEnsureApiSession().finally(reload);
      else reload();
    });
    if (api.getToken()) reload();
  })();
  </script>
</body></html>
